<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NFS-e | Conta Comigo</title>
<style>
  :root {
    color-scheme: light dark;
    --azul: #0B2A8C;
    --azul-fundo: #071D63;
    --verde: #5CB944;

    --fundo: #f3f5fa;
    --cartao: #ffffff;
    --painel: #f8f9fc;
    --borda: #e2e6f0;
    --texto: #1c2033;
    --suave: #6b7189;
    --realce: #0B2A8C;
    --realce-fundo: #eef2ff;
    --foco: rgba(11, 42, 140, .14);
    --sombra: 0 1px 2px rgba(16, 24, 64, .05), 0 2px 8px rgba(16, 24, 64, .04);
    --sombra-alta: 0 4px 14px rgba(16, 24, 64, .10);

    --ok-fundo: #e8f6e6;   --ok-texto: #2f7d20;   --ok-borda: #bfe3ba;
    --erro-fundo: #fdeaea; --erro-texto: #a52020; --erro-borda: #f2c4c4;
    --pend-fundo: #fff6e5; --pend-texto: #8a5a00; --pend-borda: #f0d7a4;
    --rodando-fundo: #eef0f7; --rodando-texto: #6b7189;
  }

  /* Tema escuro próprio: sem ele o Chrome escurece a página sozinho e as cores ficam estranhas. */
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0d1016;
      --cartao: #151a23;
      --painel: #10141c;
      --borda: #252c39;
      --texto: #e6e8ef;
      --suave: #9299ad;
      --realce: #9db2ff;
      --realce-fundo: rgba(157, 178, 255, .10);
      --foco: rgba(157, 178, 255, .22);
      --sombra: 0 1px 2px rgba(0, 0, 0, .3);
      --sombra-alta: 0 6px 18px rgba(0, 0, 0, .45);

      --ok-fundo: rgba(92, 185, 68, .13);    --ok-texto: #8fd67a;   --ok-borda: rgba(92, 185, 68, .35);
      --erro-fundo: rgba(229, 72, 77, .13);  --erro-texto: #ff9a9a; --erro-borda: rgba(229, 72, 77, .38);
      --pend-fundo: rgba(240, 170, 40, .13); --pend-texto: #f3c26b; --pend-borda: rgba(240, 170, 40, .38);
      --rodando-fundo: #1d2330; --rodando-texto: #9299ad;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--texto);
    background: var(--fundo);
    -webkit-font-smoothing: antialiased;
  }

  [hidden] { display: none !important; }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(135deg, var(--azul-fundo), var(--azul));
    border-bottom: 4px solid var(--verde);
    padding: .85rem 2rem .85rem 8.5rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .marca {
    height: 48px;
    width: auto;
    display: block;
  }

  .app {
    color: #fff;
    font-size: 1.05rem;
    font-weight: 500;
    padding-left: 1.5rem;
    border-left: 1px solid rgba(255, 255, 255, .28);
  }

  main {
    max-width: 820px;
    margin: 2rem auto 4rem;
    padding: 0 1.5rem;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 650;
    letter-spacing: -.01em;
    margin: 0 0 .25rem;
  }

  .busca-area {
    position: sticky;
    top: 75px;
    background: var(--fundo);
    padding: 1rem 0 .75rem;
    z-index: 10;
  }

  .linha-busca {
    display: flex;
    gap: .75rem;
    align-items: stretch;
  }

  .campo {
    position: relative;
    flex: 1;
  }

  #busca,
  #competencia {
    font: inherit;
    color: var(--texto);
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 12px;
    box-shadow: var(--sombra);
    transition: border-color .15s, box-shadow .15s;
  }

  #busca {
    width: 100%;
    height: 100%;
    padding: .85rem 2.9rem .85rem 1rem;
    font-size: 1rem;
  }

  #busca::placeholder { color: var(--suave); }

  #busca:focus,
  #competencia:focus {
    outline: none;
    border-color: var(--realce);
    box-shadow: 0 0 0 3px var(--foco);
  }

  #limpar {
    position: absolute;
    right: .55rem;
    top: 50%;
    transform: translateY(-50%);
    width: 1.8rem;
    height: 1.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--suave);
    font-size: 1.35rem;
    line-height: 1;
    cursor: pointer;
  }

  #limpar:hover {
    background: var(--rodando-fundo);
    color: var(--texto);
  }

  .competencia {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: .2rem;
    font-size: .72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--suave);
  }

  #competencia {
    padding: .55rem .8rem;
    font-size: .95rem;
  }

  #contador {
    font-size: .82rem;
    color: var(--suave);
    margin: .7rem .2rem 0;
    text-align: right;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }

  li {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: .75rem 1rem;
    padding: .9rem 1.1rem;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 12px;
    box-shadow: var(--sombra);
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }

  li:hover {
    border-color: var(--realce);
    box-shadow: var(--sombra-alta);
  }

  .nome {
    font-weight: 600;
    min-width: 0;
  }

  .direita {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-left: auto;
  }

  .raiz {
    color: var(--suave);
    font-size: .85rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .filiais {
    margin-left: .5rem;
    padding: .12rem .5rem;
    border-radius: 999px;
    background: var(--ok-fundo);
    color: var(--ok-texto);
    font-size: .75rem;
    font-weight: 600;
  }

  .acao {
    min-width: 7.5rem;
    text-align: center;
    padding: .45rem .95rem;
    border-radius: 999px;
    font-size: .82rem;
    font-weight: 600;
    background: transparent;
    color: var(--ok-texto);
    border: 1px solid var(--ok-borda);
    transition: background .15s, color .15s;
  }

  li:hover .acao {
    background: var(--verde);
    border-color: var(--verde);
    color: #fff;
  }

  .acao.rodando,
  li:hover .acao.rodando {
    background: var(--rodando-fundo);
    color: var(--rodando-texto);
    border-color: var(--borda);
  }

  .acao.pronto,
  li:hover .acao.pronto {
    background: var(--ok-fundo);
    color: var(--ok-texto);
    border-color: var(--ok-borda);
  }

  .acao.erro,
  li:hover .acao.erro {
    background: var(--erro-fundo);
    color: var(--erro-texto);
    border-color: var(--erro-borda);
  }

  .acao.pendencia,
  li:hover .acao.pendencia {
    background: var(--pend-fundo);
    color: var(--pend-texto);
    border-color: var(--pend-borda);
  }

  .mes {
    flex-basis: calc(100% + 2.2rem);
    cursor: default;
    margin: .2rem -1.1rem -.9rem;
    padding: .8rem 1.1rem .9rem;
    background: var(--painel);
    border-top: 1px solid var(--borda);
    border-radius: 0 0 12px 12px;
    display: flex;
    flex-direction: column;
    gap: .4rem;
  }

  .mes-titulo {
    font-size: .72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--suave);
    margin-bottom: .15rem;
  }

  .estab {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .5rem 1rem;
    padding: .55rem .75rem;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 10px;
  }

  .estab-id {
    display: flex;
    align-items: center;
    gap: .55rem;
    min-width: 15.5rem;
  }

  .tipo {
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: .12rem .45rem;
    border-radius: 6px;
    background: var(--realce-fundo);
    color: var(--realce);
  }

  .cnpj {
    font-size: .88rem;
    font-variant-numeric: tabular-nums;
  }

  .contagens {
    display: flex;
    gap: 1.1rem;
    flex: 1;
    font-size: .85rem;
    color: var(--suave);
    font-variant-numeric: tabular-nums;
  }

  .contagens strong {
    font-size: 1rem;
    font-weight: 650;
    color: var(--texto);
  }

  .estab.vazio {
    background: transparent;
    border-style: dashed;
  }

  .estab.vazio .contagens,
  .estab.vazio .cnpj { opacity: .6; }

  .botoes {
    display: flex;
    gap: .4rem;
    margin-left: auto;
  }

  .botao-mes {
    padding: .38rem .8rem;
    border-radius: 8px;
    border: 1px solid var(--borda);
    background: var(--cartao);
    color: var(--realce);
    font: inherit;
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }

  .botao-mes:hover {
    background: var(--realce-fundo);
    border-color: var(--realce);
  }

  @media (max-width: 640px) {
    header { padding-left: 1rem; }
    .linha-busca { flex-direction: column; }
    .estab-id { min-width: 0; }
  }
</style>
</head>
<body>

<header>
  <img src="/logo.png" alt="Conta Comigo" class="marca">
  <span class="app">Notas Fiscais de Serviço</span>
</header>

<main>
  <h1>Escolha a empresa</h1>
  <div class="busca-area">
    <div class="linha-busca">
      <div class="campo">
        <input id="busca" placeholder="Nome ou CNPJ da empresa" autofocus>
        <button id="limpar" type="button" aria-label="Limpar busca" hidden>&times;</button>
      </div>
      <label class="competencia">Competência
        <input id="competencia" type="month">
      </label>
    </div>
    <p id="contador"></p>
  </div>
  <ul id="lista">
  {{range .}}
    <li data-busca="{{.Name}} {{.Root}}" data-raiz="{{.Root}}">
      <span class="nome">{{.Name}}</span>
        <span class="direita">
        <span class="raiz">{{.Root}}{{if gt (len .CNPJs) 1}}<span class="filiais">{{len .CNPJs}} estab.</span>{{end}}</span>
        <span class="acao">Baixar</span>
      </span>
    </li>

  {{end}}
  </ul>
</main>

<script>
const busca = document.getElementById('busca');
const limpar = document.getElementById('limpar');
const contador = document.getElementById('contador');
const itens = Array.from(document.querySelectorAll('#lista li'));

function filtrar() {
  const termo = busca.value.toLowerCase();
  limpar.hidden = termo === '';

  let visiveis = 0;
  for (const li of itens) {
    const mostra = li.dataset.busca.toLowerCase().includes(termo);
    li.hidden = !mostra;
    if (mostra) visiveis++;
  }
  contador.textContent = visiveis + (visiveis === 1 ? ' empresa' : ' empresas');
}

function limparBusca() {
  busca.value = '';
  busca.focus();
  filtrar();
}

busca.addEventListener('input', filtrar);
limpar.addEventListener('click', limparBusca);
busca.addEventListener('keydown', (evento) => {
  if (evento.key === 'Escape') limparBusca();
});
filtrar();

function mostrar(acao, texto, situacao) {
  acao.textContent = texto;
  acao.className = situacao ? 'acao ' + situacao : 'acao';
}

function numero(valor) {
  return valor.toLocaleString('pt-BR');
}

function andamento(tarefa) {
  if (tarefa.salvos === 0) return 'Baixando...';

  let texto = numero(tarefa.salvos) + ' notas';
  if (tarefa.etapas > 1) texto += ' - ' + tarefa.etapa + '/' + tarefa.etapas;
  return texto;
}

function acompanhar(li) {
  const acao = li.querySelector('.acao');

  const relogio = setInterval(async () => {
    const resposta = await fetch('/status?raiz=' + li.dataset.raiz);
    if (!resposta.ok) return;

    const tarefa = await resposta.json();
    if (tarefa.situacao === 'rodando') {
      mostrar(acao, andamento(tarefa), 'rodando');
      return;
    }

    clearInterval(relogio);
    li.dataset.ocupado = 'nao';

    if (tarefa.situacao === 'pendente') {
      mostrar(acao, tarefa.pendencia, 'pendencia');
      li.title = tarefa.mensagem;
      return;
    }

    if (tarefa.situacao === 'erro') {
      mostrar(acao, 'Falhou', 'erro');
      li.title = tarefa.mensagem;
      return;
    }

    mostrar(acao, tarefa.salvos > 0 ? numero(tarefa.salvos) + ' notas' : 'Nada novo', 'pronto');
    mostrarMes(li);

  }, 2000);
}

const competencia = document.getElementById('competencia');
const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho',
               'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

function mesAnterior() {
  const data = new Date();
  data.setDate(1);
  data.setMonth(data.getMonth() - 1);
  return data.getFullYear() + '-' + String(data.getMonth() + 1).padStart(2, '0');
}

function nomeDoMes(valor) {
  const [ano, mes] = valor.split('-');
  return meses[Number(mes) - 1] + '/' + ano;
}

competencia.value = mesAnterior();
competencia.addEventListener('change', () => {
  for (const li of itens) {
    if (li.querySelector('.mes')) mostrarMes(li);
  }
});

async function mostrarMes(li) {
  const mes = competencia.value;
  let painel = li.querySelector('.mes');

  const resposta = await fetch(`/mes?raiz=${li.dataset.raiz}&competencia=${mes}`);
  if (!resposta.ok) {
    if (painel) painel.remove();
    return;
  }
  const pastas = await resposta.json();

  if (!painel) {
    painel = document.createElement('div');
    painel.className = 'mes';
    painel.addEventListener('click', (evento) => evento.stopPropagation());
    li.append(painel);
  }

  // Ordenar pelo CNPJ põe a matriz (0001) em cima.
  pastas.sort((a, b) => a.cnpj.localeCompare(b.cnpj));

  const titulo = texto('div', 'mes-titulo', 'Competência ' + nomeDoMes(mes));
  painel.replaceChildren(titulo, ...pastas.map((pasta) => linhaDoMes(li, pasta, mes)));
}

function linhaDoMes(li, pasta, mes) {
  const vazio = pasta.tomadas + pasta.prestadas === 0;

  const linha = document.createElement('div');
  linha.className = vazio ? 'estab vazio' : 'estab';

  const tipo = pasta.cnpj.slice(8, 12) === '0001' ? 'Matriz' : 'Filial';
  const id = texto('div', 'estab-id');
  id.append(texto('span', 'tipo', tipo), texto('span', 'cnpj', formatarCNPJ(pasta.cnpj)));

  const contagens = texto('div', 'contagens');
  contagens.append(contagem(pasta.tomadas, 'tomadas'), contagem(pasta.prestadas, 'prestadas'));

  linha.append(id, contagens);
  if (vazio) return linha;

  const abrir = botaoDoMes('Abrir pasta', () =>
    fetch(`/abrir?raiz=${li.dataset.raiz}&cnpj=${pasta.cnpj}&competencia=${mes}`, { method: 'POST' }));

  const copiar = botaoDoMes('Copiar caminho', async () => {
    await copiarTexto(pasta.caminho);
    copiar.textContent = 'Copiado!';
    setTimeout(() => { copiar.textContent = 'Copiar caminho'; }, 1500);
  });

  const botoes = texto('div', 'botoes');
  botoes.append(abrir, copiar);
  linha.append(botoes);
  return linha;
}

function texto(tag, classe, conteudo) {
  const elemento = document.createElement(tag);
  elemento.className = classe;
  if (conteudo !== undefined) elemento.textContent = conteudo;
  return elemento;
}

function contagem(valor, rotulo) {
  const span = document.createElement('span');
  const forte = document.createElement('strong');
  forte.textContent = numero(valor);
  span.append(forte, ' ' + rotulo);
  return span;
}

function formatarCNPJ(cnpj) {
  if (cnpj.length !== 14) return cnpj;
  return `${cnpj.slice(0, 2)}.${cnpj.slice(2, 5)}.${cnpj.slice(5, 8)}/${cnpj.slice(8, 12)}-${cnpj.slice(12)}`;
}

function botaoDoMes(rotulo, aoClicar) {
  const botao = document.createElement('button');
  botao.type = 'button';
  botao.className = 'botao-mes';
  botao.textContent = rotulo;
  botao.addEventListener('click', aoClicar);
  return botao;
}

async function copiarTexto(conteudo) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(conteudo);
    return;
  }
  const campo = document.createElement('textarea');
  campo.value = conteudo;
  document.body.append(campo);
  campo.select();
  document.execCommand('copy');
  campo.remove();
}

for (const li of itens) {
  li.addEventListener('click', async () => {
    if (li.dataset.ocupado === 'sim') return;

    const acao = li.querySelector('.acao');
    li.dataset.ocupado = 'sim';
    mostrar(acao, 'Iniciando...', 'rodando');

    const resposta = await fetch(`/baixar?raiz=${li.dataset.raiz}&competencia=${competencia.value}`, { method: 'POST' });
    if (!resposta.ok) {
      mostrar(acao, (await resposta.text()).trim(), 'erro');
      li.dataset.ocupado = 'nao';
      return;
    }

    mostrar(acao, 'Baixando...', 'rodando');
    acompanhar(li);
  });
}

</script>
</body>
</html>
